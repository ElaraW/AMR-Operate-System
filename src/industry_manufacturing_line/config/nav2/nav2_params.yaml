amcl:
  ros__parameters:
    use_sim_time: true
    base_frame_id: base_link
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: /scan
    set_initial_pose: true
    initial_pose_x: 0.0
    initial_pose_y: 0.0
    initial_pose_a: 0.0
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 10.0
    laser_min_range: 0.1
    max_beams: 60
    min_particles: 100
    max_particles: 2000
    pf_err: 0.01
    pf_z: 0.99
    recovery_alpha_slow: 0.001
    recovery_alpha_fast: 0.1
    resample_interval: 1
    transform_tolerance: 0.1
    update_min_a: 0.2
    update_min_d: 0.2
    z_hit: 0.8
    z_rand: 0.05
    z_short: 0.05
    z_max: 0.1

map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: "/home/elaraw/AMR-Operate-System/src/industry_manufacturing_line/config/nav2/map.yaml"

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    controller_plugins: ["FollowPath"]
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.1
      yaw_goal_tolerance: 0.1
      stateful: true
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      critics: ["BaseObstacle", "PathAlign", "PathDist", "GoalAlign", "GoalDist", "RotateToGoal"]
      max_vel_x: 0.5
      min_vel_x: -0.5
      max_vel_y: 0.0
      max_vel_theta: 1.0
      min_speed_xy: 0.0
      min_speed_theta: 0.0

local_costmap:
  local_costmap:
    ros__parameters:
      plugins: ["voxel_layer", "inflation_layer"]   # 替换 obstacle_layer
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        observation_sources: scan point_cloud
        scan:
          topic: /scan
          data_type: LaserScan
          marking: true
          clearing: true
          obstacle_range: 9.5
          raytrace_range: 10.5
        point_cloud:
          topic: /camera/rgbd_camera/points
          data_type: PointCloud2
          marking: true
          clearing: true
          obstacle_range: 3.0
          raytrace_range: 3.5
          min_height: 0.0
          max_height: 2.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.5
        cost_scaling_factor: 5.0


global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      allow_unknown: true
      global_frame: map
      robot_base_frame: base_link
      update_frequency: 1.0
      publish_frequency: 1.0
      static_map: true
      resolution: 0.05
      plugins:
        - name: static_layer
          type: "costmap_2d::StaticLayer"
        - name: obstacle_layer
          type: "costmap_2d::ObstacleLayer"
        - name: inflation_layer
          type: "costmap_2d::InflationLayer"
      obstacle_layer:
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          marking: true
          clearing: true
          obstacle_range: 9.5
          raytrace_range: 10.5


planner_server:
  ros__parameters:
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.3
      use_astar: true
      allow_unknown: true


behavior_server:
  ros__parameters:
    use_sim_time: true

bt_navigator:
  ros__parameters:
    use_sim_time: true
    default_bt_xml_filename: "package://nav2_bt_navigator/behavior_trees/navigate_to_pose.xml"
    bt_loop_duration_ms: 220
    transform_tolerance: 0.7
    cancel_on_timeout: false

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    max_velocity: [0.5, 0.0, 1.0]
    min_velocity: [-0.5, 0.0, -1.0]
    max_accel: [1.0, 0.0, 1.5]
    max_decel: [-1.0, 0.0, -1.5]
    odom_topic: "odom"
    odom_duration_sec: 0.0
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0